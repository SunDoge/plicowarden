[package]
name = "plicowarden"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]
resolver = "3"
members = ["sdk"]

[dependencies]
plico = { git = "https://github.com/SunDoge/plico.git", rev = "87de4907d414d0f3190aa4d31c99efbc640f6b18" }
plico-dev = { git = "https://github.com/SunDoge/plico.git", rev = "87de4907d414d0f3190aa4d31c99efbc640f6b18" }
plico-runtime = { git = "https://github.com/SunDoge/plico.git", rev = "87de4907d414d0f3190aa4d31c99efbc640f6b18" }
plico-desktop = { git = "https://github.com/SunDoge/plico.git", rev = "87de4907d414d0f3190aa4d31c99efbc640f6b18", default-features = false, features = ["wgpu"] }
plico-renderer = { git = "https://github.com/SunDoge/plico.git", rev = "87de4907d414d0f3190aa4d31c99efbc640f6b18" }
plicowarden-sdk = { path = "sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9.2"
usage-rs = "7.0.0"
zeroize = "1.9"
directories = "6.0.0"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.plicowarden]
opt-level = 0
