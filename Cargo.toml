[workspace]
resolver = "3"
members = ["crates/plicowarden-sdk"]
default-members = [".", "crates/plicowarden-sdk"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["SunDoge"]
license = "GPL-3.0-only"
repository = "https://github.com/SunDoge/plicowarden"

[workspace.dependencies]
# Keep every Plico crate on one reviewed framework revision.
plico = { git = "https://github.com/SunDoge/plico.git", rev = "e35ecc93bf8be802ed195468e7b895cd3628f71e" }
plico-dev = { git = "https://github.com/SunDoge/plico.git", rev = "e35ecc93bf8be802ed195468e7b895cd3628f71e" }
plico-desktop = { git = "https://github.com/SunDoge/plico.git", rev = "e35ecc93bf8be802ed195468e7b895cd3628f71e", default-features = false, features = ["wgpu", "desktop-integration"] }
plico-renderer = { git = "https://github.com/SunDoge/plico.git", rev = "e35ecc93bf8be802ed195468e7b895cd3628f71e" }
plico-runtime = { git = "https://github.com/SunDoge/plico.git", rev = "e35ecc93bf8be802ed195468e7b895cd3628f71e" }
plico-wgpu = { git = "https://github.com/SunDoge/plico.git", rev = "e35ecc93bf8be802ed195468e7b895cd3628f71e" }
plicowarden-sdk = { path = "crates/plicowarden-sdk" }

# Keep the copied application service on one official SDK revision.
bitwarden-api-api = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-api-base = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-auth = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-core = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e", features = ["internal"] }
bitwarden-crypto = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-crypto-sync-handler = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-encoding = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-exporters = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-importers = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-pm = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-state = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-sync = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }
bitwarden-vault = { git = "https://github.com/bitwarden/sdk-internal.git", rev = "fbd21679c1c3690cba424ad3dbb0ba662eb9863e" }

# Shared ordinary dependencies inherit their version and additive features.
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9.2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "net", "macros", "io-util"] }
zeroize = "1.9"

[package]
name = "plicowarden"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "A native Rust desktop client for Bitwarden-compatible vaults"
publish = false

[package.metadata.packager]
product-name = "Plicowarden"
identifier = "io.github.sundoge.plicowarden"
publisher = "SunDoge"
category = "Utility"
homepage = "https://github.com/SunDoge/plicowarden"
long-description = "Plicowarden is a native Rust desktop password-manager client for Bitwarden-compatible vaults, with local encrypted caching, search and an opt-in Unix SSH agent."
icons = ["packaging/icons/*.png", "packaging/icons/*.ico"]
license-file = "LICENSE"
binaries = [{ path = "plicowarden", main = true }]

[package.metadata.packager.linux]
generate-desktop-entry = true

[package.metadata.packager.deb]
section = "utils"
priority = "optional"
depends = [
    "libc6",
    "libgcc-s1",
    "libfontconfig1",
    "libgtk-4-1",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libwayland-client0",
    "libx11-6",
    "libxkbcommon0",
]

[package.metadata.packager.nsis]
installer-icon = "packaging/icons/plicowarden.ico"
installer-mode = "currentUser"

[package.metadata.packager.macos]
minimum-system-version = "13.0"
signing-identity = "-"

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
plico.workspace = true
plico-dev.workspace = true
plico-runtime.workspace = true
plico-desktop.workspace = true
plico-renderer.workspace = true
plicowarden-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
snafu.workspace = true
usage-rs = "7.0.0"
zeroize.workspace = true
directories.workspace = true
getrandom = "0.3"
rfd = "0.17.2"

[features]
default = []
linux-bundled-freetype = ["plico-desktop/linux-bundled-freetype"]

[dev-dependencies]
tempfile.workspace = true
pollster = "1"
plico-wgpu.workspace = true

[profile.dev]
opt-level = 1
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.plicowarden]
opt-level = 0
