[package]
name = "plicowarden"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace]
resolver = "3"
members = ["sdk"]

[dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
plico = { git = "https://github.com/SunDoge/plico.git", rev = "91f38b58f7bd98830f24acdb50e90eb4cc5283f1" }
plico-dev = { git = "https://github.com/SunDoge/plico.git", rev = "91f38b58f7bd98830f24acdb50e90eb4cc5283f1" }
plico-runtime = { git = "https://github.com/SunDoge/plico.git", rev = "91f38b58f7bd98830f24acdb50e90eb4cc5283f1" }
plico-desktop = { git = "https://github.com/SunDoge/plico.git", rev = "91f38b58f7bd98830f24acdb50e90eb4cc5283f1", default-features = false, features = ["wgpu", "desktop-integration"] }
plico-renderer = { git = "https://github.com/SunDoge/plico.git", rev = "91f38b58f7bd98830f24acdb50e90eb4cc5283f1" }
plicowarden-sdk = { path = "sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9.2"
usage-rs = "7.0.0"
zeroize = "1.9"
directories = "6.0.0"
getrandom = "0.3"
rfd = "0.17.2"

[dev-dependencies]
tempfile = "3"
pollster = "1"
plico-wgpu = { git = "https://github.com/SunDoge/plico.git", rev = "91f38b58f7bd98830f24acdb50e90eb4cc5283f1" }

[profile.dev]
opt-level = 1
incremental = true
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.dev.package.plicowarden]
opt-level = 0
