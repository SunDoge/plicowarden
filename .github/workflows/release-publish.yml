name: Release publish

on:
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to rebuild and upload
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-publish
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  plan:
    name: Validate release source
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.title, 'chore: release Plicowarden'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      create-release: ${{ steps.plan.outputs.create-release }}
      ref: ${{ steps.plan.outputs.ref }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.event.pull_request.merge_commit_sha || 'main' }}
          persist-credentials: false
      - name: Resolve version and immutable source
        id: plan
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          ref="$(git rev-parse HEAD)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          tag="${REQUESTED_TAG:-v$version}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          if [[ "${tag#v}" != "$version" ]]; then
            echo "tag version ${tag#v} does not match Cargo version $version" >&2
            exit 1
          fi
          create_release=true
          if [[ -n "$REQUESTED_TAG" ]]; then
            git rev-parse --verify "refs/tags/$tag^{commit}" >/dev/null
            ref="$tag"
            create_release=false
          fi

          echo "create-release=$create_release" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux x86_64
    needs: plan
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libfontconfig1-dev libpango1.0-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libgtk-4-dev
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: x86_64-unknown-linux-gnu
          cache-key: release-linux-x86_64-v1
          cache-workspace-crates: true
          cache-on-failure: false
      - name: Build Plicowarden
        run: cargo build --locked --release --package plicowarden --target x86_64-unknown-linux-gnu
      - name: Create archive
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          name="plicowarden-v$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          install -m755 target/x86_64-unknown-linux-gnu/release/plicowarden "dist/$name/plicowarden"
          install -m644 README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - name: Upload Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-x86_64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x86_64
    needs: plan
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          cache-key: release-windows-x86_64-v1
          cache-workspace-crates: true
          cache-on-failure: false
      - name: Build Plicowarden
        run: cargo build --locked --release --package plicowarden --target x86_64-pc-windows-msvc
      - name: Create archive
        shell: pwsh
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $name = "plicowarden-v$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Force -Path "dist/$name" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/plicowarden.exe" "dist/$name/"
          Copy-Item README.md, LICENSE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
      - name: Upload Windows archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows-x86_64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS Universal
    needs: plan
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: aarch64-apple-darwin,x86_64-apple-darwin
          cache-key: release-macos-universal-v1
          cache-workspace-crates: true
          cache-on-failure: false
      - name: Build both macOS architectures
        run: |
          cargo build --locked --release --package plicowarden --target aarch64-apple-darwin
          cargo build --locked --release --package plicowarden --target x86_64-apple-darwin
      - name: Create application bundle
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          app="dist/Plicowarden.app"
          mkdir -p "$app/Contents/MacOS"
          lipo -create \
            target/aarch64-apple-darwin/release/plicowarden \
            target/x86_64-apple-darwin/release/plicowarden \
            -output "$app/Contents/MacOS/plicowarden"
          chmod 755 "$app/Contents/MacOS/plicowarden"
          cat > "$app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>plicowarden</string>
            <key>CFBundleIdentifier</key><string>dev.naiwa.plicowarden</string>
            <key>CFBundleName</key><string>Plicowarden</string>
            <key>CFBundleDisplayName</key><string>Plicowarden</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" \
            "dist/plicowarden-v$VERSION-macos-universal.zip"
      - name: Upload macOS archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos-universal
          path: dist/plicowarden-*.zip
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create or validate GitHub Release
    needs: [plan, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out the tested source and all tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.ref }}
          persist-credentials: false
      - name: Install Rust
        if: needs.plan.outputs.create-release == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
      - name: Keep the tested commit on the main branch
        if: needs.plan.outputs.create-release == 'true'
        run: git checkout -B main
      - name: Create Git tag and GitHub Release
        if: needs.plan.outputs.create-release == 'true'
        uses: release-plz/action@8921286633dfa0c4020f7f30bd1c14fe19cbb10e # v0.5.142
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Validate published release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          git rev-parse --verify "refs/tags/$TAG^{commit}" >/dev/null
          gh release view "$TAG" >/dev/null

  publish-assets:
    name: Publish release assets
    needs: [plan, release, linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: |
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > SHA256SUMS
          test -s SHA256SUMS
      - name: Attach archives to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" release-assets/* --clobber
