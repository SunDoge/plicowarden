name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  linux:
    name: Linux tests and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libfontconfig1-dev libpango1.0-dev libwayland-dev \
            libxkbcommon-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev libgtk-4-dev
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          components: rustfmt,clippy
          cache-key: ci-linux-v1
          cache-workspace-crates: true
          cache-on-failure: false
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check packaging assets
        run: python3 scripts/check-packaging-assets.py
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Test Rust workspace
        run: cargo test --locked --workspace
      - name: Lint Rust workspace
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install Bun
        uses: oven-sh/setup-bun@3d267786b128fe76c2f16a390aa2448b815359f3 # v2.1.2
      - name: Install TypeScript dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bun run check
      - name: Test TypeScript
        run: bun run test

  windows:
    name: Windows tests
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2
        with:
          toolchain: stable
          target: x86_64-pc-windows-msvc
          cache-key: ci-windows-v1
          cache-workspace-crates: true
          # A test failure happens after an expensive full Windows compile.
          # Keep that cache on main so the corrective run does not rebuild it.
          cache-on-failure: true
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test Windows workspace
        run: cargo test --locked --workspace --target x86_64-pc-windows-msvc
