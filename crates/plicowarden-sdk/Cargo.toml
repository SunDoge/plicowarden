[package]
name = "plicowarden-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
rusqlite = { version = "0.39", features = ["bundled"] }
bitwarden-state.workspace = true
bitwarden-crypto.workspace = true
bitwarden-encoding.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico", "webp"] }
bitwarden-api-base.workspace = true
tracing = "0.1"
http = "1"
reqwest = { version = "0.13", default-features = false }
reqwest-middleware = "0.5"
futures-util = "0.3"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
rmp-serde = "1.3"
bitwarden-auth.workspace = true
arboard = { version = "3.7", default-features = false, features = ["wayland-data-control"] }
async-trait = "0.1.91"
bitwarden-api-api.workspace = true
bitwarden-core.workspace = true
bitwarden-crypto-sync-handler.workspace = true
bitwarden-pm.workspace = true
bitwarden-sync.workspace = true
bitwarden-vault.workspace = true
bitwarden-exporters.workspace = true
bitwarden-importers.workspace = true
chrono = "0.4"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url = "2.5.8"
uuid = "1"
zeroize = { workspace = true, features = ["serde"] }
snafu.workspace = true

ssh-agent-lib = "0.6.0"
signature = "2"
rsa = "0.9"
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
directories.workspace = true
memsec = "0.7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process", "mm", "param"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
